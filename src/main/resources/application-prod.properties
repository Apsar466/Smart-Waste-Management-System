# ─── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# ─── Database — PostgreSQL (production on Render) ───────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── SQL Init (seed data) ────────────────────────────────────────────────────
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ─── File Upload ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForSmartWasteManagementSystemBackend1234567890SecretKeyMustBeLong}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── Gemini ──────────────────────────────────────────────────────────────────
app.gemini.api-key=${GEMINI_API_KEY:}

# ─── Springdoc ───────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.smartwaste=INFO
logging.level.org.springframework.security=WARN
