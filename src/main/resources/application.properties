# Server config
server.port=8080
server.servlet.context-path=/api

# Database Configuration (Local MySQL instance on port 3306)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_waste}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:smartwaste123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SQL Init Configuration for Default Seed Data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# File Upload configurations (Max size 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration Parameters
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForSmartWasteManagementSystemBackend1234567890SecretKeyMustBeLong}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Google Gemini API Key
app.gemini.api-key=${GEMINI_API_KEY:${gemini.api.key:}}

# Springdoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.smartwaste=DEBUG
logging.level.org.springframework.security=WARN

# Gemini API key — set via environment variable GEMINI_API_KEY on your server
# gemini.api.key=YOUR_KEY_HERE
