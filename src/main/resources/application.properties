# Server config
server.port=${PORT:8080}
server.servlet.context-path=/api

# Database Configuration — Embedded H2 Default
spring.datasource.url=jdbc:h2:mem:smart_waste;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Init Configuration for Default Seed Data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload configurations (Max size 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration Parameters
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForSmartWasteManagementSystemBackend1234567890SecretKeyMustBeLong}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Google Gemini API Key
app.gemini.api-key=${GEMINI_API_KEY:${gemini.api.key:}}

# Springdoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.smartwaste=DEBUG
logging.level.org.springframework.security=WARN
